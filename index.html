<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: Arial, sans-serif;
    padding: 10px;
    background: #fff;
    height: auto;
    overflow: hidden;
  }
  .visit-container {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .visit-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    color: white;
  }
  .btn-in  { background-color: #2ecc71; }
  .btn-in:hover  { background-color: #27ae60; }
  .btn-out { background-color: #e74c3c; }
  .btn-out:hover { background-color: #c0392b; }
  #statusMsg {
    margin-top: 6px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="visit-container" id="visitContainer">
  <button class="visit-btn btn-in"  onclick="recordVisit('In')">📍 Visit In</button>
  <button class="visit-btn btn-out" onclick="recordVisit('Out')">📍 Visit Out</button>
</div>
<div id="statusMsg"></div>

<script src="https://live.zwidgets.com/js-sdk/1.0.1/ZohoEmbededAppSDK.min.js"></script>
<script>

var currentLeadId = null;

function showMsg(msg, color) {
  var el = document.getElementById("statusMsg");
  el.style.color = color;
  el.innerText = msg;
  if (color === "green") {
    setTimeout(function() { el.innerText = ""; }, 4000);
  }
}

function recordVisit(type) {
  showMsg("Getting your location...", "orange");

  if (!navigator.geolocation) {
    showMsg("Geolocation not supported.", "red");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {
      var lat = position.coords.latitude.toFixed(6);
      var lng = position.coords.longitude.toFixed(6);
      var acc = Math.round(position.coords.accuracy);

      var now = new Date();
      var formattedTime = now.toLocaleString("en-IN", {
        day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: true
      });

      var mapsLink = "https://maps.google.com/?q=" + lat + "," + lng;
      var content = "Site Visit " + type.toUpperCase() + " recorded at " + formattedTime
                  + " | Lat: " + lat
                  + " | Lng: " + lng
                  + " | Accuracy: " + acc + "m"
                  + " | Maps: " + mapsLink;

      ZOHO.CRM.API.createRecord({
        Entity: "Notes",
        APIData: {
          "Note_Title"  : "Visit " + type,
          "Note_Content": content,
          "Parent_Id"   : currentLeadId,
          "se_module"   : "Leads"
        }
      }).then(function(resp) {
        if (resp.data && resp.data[0].code === "SUCCESS") {
          showMsg("✅ Visit " + type + " saved at " + formattedTime, "green");
        } else {
          showMsg("❌ Failed: " + JSON.stringify(resp), "red");
        }
      }).catch(function(err) {
        showMsg("❌ Error: " + err, "red");
      });
    },
    function(err) {
      var msgs = {
        1: "❌ Location permission denied.",
        2: "❌ Location unavailable.",
        3: "❌ Location timed out."
      };
      showMsg(msgs[err.code] || "❌ Unknown error.", "red");
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

ZOHO.embeddedApp.on("PageLoad", function(data) {
  currentLeadId = data.EntityId;

  ZOHO.CRM.API.getRecord({
    Entity: "Leads",
    RecordID: currentLeadId
  }).then(function(response) {
    var record = response.data[0];
    var name = record["Customer_Name"]
            || record["Full_Name"]
            || record["Last_Name"]
            || "";

    if (name.indexOf("|") === -1) {
      document.getElementById("visitContainer").style.display = "none";
    }
  });
});

ZOHO.embeddedApp.init();

</script>
</body>
</html>
